# Machine Learning Project Parameters

# Data Split Configuration
data_split:
  eval_start_date: "2020-01-01"
  holdout_start_date: "2022-01-01"
  random_state: 42

# Data Preprocessing
preprocessing:
  price_outlier_threshold: 19000000
  drop_na_threshold: 0.5
  
# Baseline Model - XGBoost Training Parameters
baseline_model:
  n_estimators: 500
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  tree_method: "hist"
  random_state: 42
  n_jobs: -1

# Hyperparameter Tuning - Optuna Configuration
tuning:
  n_trials: 15
  n_estimators_range: [200, 800]
  max_depth_range: [3, 10]
  learning_rate_range: [0.01, 0.3]
  subsample_range: [0.5, 1.0]
  colsample_bytree_range: [0.5, 1.0]
  min_child_weight_range: [1, 10]
  gamma_range: [0.0, 5.0]
  reg_alpha_range: [1e-8, 10.0]
  reg_lambda_range: [1e-8, 10.0]
  optimization_metric: "rmse"
  
# MLflow Tracking
mlflow:
  tracking_uri: "sqlite:///mlruns.db"
  experiment_name: "housing_regression"
  
# Feature Engineering
features:
  date_freq: "date_features"
  encoding_method: "target_encoding"
  frequency_encode_cols: ["zipcode"]
  target_encode_cols: ["city_full"]
  
# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: true
  
# Streamlit Configuration  
streamlit:
  page_title: "Housing Price Prediction"
  layout: "wide"
